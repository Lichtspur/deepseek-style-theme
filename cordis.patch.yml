# DeepSeek-Style-Theme bundle patch: inserts its public dsh.client entry into
# the web plugin roster. The bundle is the official dsh plugin shape — install
# it with `dsh plugin --profile <name> add <path-or-git-url>`.
- insert:
    - id: ui-skin-deepseek-style
      name: '@dsh-external/dsh-deepseek-style-theme'
